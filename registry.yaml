releases:
- artifact:
    digest: sha256:de9955553a0a30c6122e7aa053415601c2ddea10c7e41b8d3c47c5bd3bb0a997
    registry: https://ghcr.io
    repository: formancehq/fctl-plugin-auth
  manifest:
    name: auth
    protocolVersion: 1
    root:
      args:
        max: 0
        min: 0
      runnable: false
      short: Manage Auth clients, secrets and users
      subcommands:
      - args:
          max: 0
          min: 0
        runnable: true
        short: Show Auth server information
        use: info
      - args:
          max: 0
          min: 0
        runnable: true
        short: Show OpenID Connect discovery configuration
        use: discovery
      - args:
          max: 0
          min: 0
        runnable: false
        short: Manage OAuth2 clients
        subcommands:
        - args:
            max: 0
            min: 0
          runnable: true
          short: List OAuth2 clients
          use: list
        - args:
            max: 1
            min: 1
          inputs:
          - argument: 0
            kind: select
            required: true
            source:
              commandPath:
              - auth
              - clients
              - list
              emptyMessage: No OAuth2 clients are available; create a client first
              labelFields:
              - name
              - id
              valueField: id
            title: OAuth2 client
            valueType: string
          runnable: true
          short: Show a client and its secret metadata
          use: show CLIENT
        - args:
            max: 0
            min: 0
          flags:
          - body: true
            default: ""
            name: data
            required: true
            type: string
            usage: JSON object; inline, @file, or - for stdin
          inputs:
          - bodyPointer: /name
            kind: input
            required: true
            title: Client name
            valueType: string
          - bodyPointer: /description
            kind: input
            title: Description
            valueType: string
          - bodyPointer: /public
            default: "false"
            description: Public clients cannot keep a client secret
            kind: confirm
            title: Public client
            valueType: bool
          - bodyPointer: /trusted
            default: "false"
            description: Trusted clients bypass user consent
            kind: confirm
            title: Trusted client
            valueType: bool
          - bodyPointer: /scopes
            description: JSON array of scope strings, e.g. ["ledger:read"]
            kind: text
            title: Scopes
            valueType: json
          - bodyPointer: /redirectUris
            description: JSON array of URI strings, e.g. ["https://example.test/callback"]
            kind: text
            title: Redirect URIs
            valueType: json
          - bodyPointer: /postLogoutRedirectUris
            description: Optional JSON array of URI strings
            kind: text
            title: Post-logout redirect URIs
            valueType: json
          - bodyPointer: /metadata
            description: Optional JSON object of string values, e.g. {"purpose":"automation"}
            kind: text
            title: Metadata
            valueType: json
          long: |-
            Create an OAuth2 client.
            Options: name, description, public, trusted, redirectUris, postLogoutRedirectUris, scopes, metadata.
            The name field is required. Create a secret separately with clients secrets create.
          runnable: true
          short: Create an OAuth2 client
          use: create
        - args:
            max: 1
            min: 1
          confirm: true
          flags:
          - default: "false"
            name: confirm
            type: bool
            usage: Confirm this destructive operation
          - body: true
            default: ""
            name: data
            required: true
            type: string
            usage: JSON object; inline, @file, or - for stdin
          inputs:
          - argument: 0
            kind: select
            required: true
            source:
              commandPath:
              - auth
              - clients
              - list
              emptyMessage: No OAuth2 clients are available; create a client first
              labelFields:
              - name
              - id
              valueField: id
            title: OAuth2 client
            valueType: string
          - bodyPointer: /name
            description: New name for the client
            kind: input
            required: true
            title: Client name
            valueType: string
          - bodyPointer: /description
            description: Leave blank to preserve the current description
            kind: input
            title: Description
            valueType: string
          long: |-
            Update client options, preserving omitted fields.
            Options: name, description, public, trusted, redirectUris, postLogoutRedirectUris, scopes, metadata.
            Omitted options are preserved. Explicit false, empty arrays and empty objects clear options. Requires --confirm.
          runnable: true
          short: Update client options, preserving omitted fields
          use: update CLIENT
        - args:
            max: 1
            min: 1
          confirm: true
          flags:
          - default: "false"
            name: confirm
            type: bool
            usage: Confirm this destructive operation
          inputs:
          - argument: 0
            kind: select
            required: true
            source:
              commandPath:
              - auth
              - clients
              - list
              emptyMessage: No OAuth2 clients are available; create a client first
              labelFields:
              - name
              - id
              valueField: id
            title: OAuth2 client
            valueType: string
          runnable: true
          short: Delete an OAuth2 client
          use: delete CLIENT
        - args:
            max: 0
            min: 0
          runnable: false
          short: Manage client secrets (clear values are returned only at creation)
          subcommands:
          - args:
              max: 1
              min: 1
            inputs:
            - argument: 0
              kind: select
              required: true
              source:
                commandPath:
                - auth
                - clients
                - list
                emptyMessage: No OAuth2 clients are available; create a client first
                labelFields:
                - name
                - id
                valueField: id
              title: OAuth2 client
              valueType: string
            runnable: true
            short: List secret metadata for a client
            use: list CLIENT
          - args:
              max: 1
              min: 1
            flags:
            - body: true
              default: ""
              name: data
              required: true
              type: string
              usage: JSON object; inline, @file, or - for stdin
            inputs:
            - argument: 0
              kind: select
              required: true
              source:
                commandPath:
                - auth
                - clients
                - list
                emptyMessage: No OAuth2 clients are available; create a client first
                labelFields:
                - name
                - id
                valueField: id
              title: OAuth2 client
              valueType: string
            - bodyPointer: /name
              description: Label for the new secret; its clear value is generated
                by Auth
              kind: input
              required: true
              title: Secret name
              valueType: string
            - bodyPointer: /metadata
              description: Optional JSON object of string values, e.g. {"purpose":"ci"}
              kind: text
              title: Metadata
              valueType: json
            long: |-
              Create a secret; save the returned clear value.
              JSON object with required name and optional metadata.
            runnable: true
            short: Create a secret; save the returned clear value
            use: create CLIENT
          - args:
              max: 2
              min: 2
            confirm: true
            flags:
            - default: "false"
              name: confirm
              type: bool
              usage: Confirm this destructive operation
            inputs:
            - argument: 0
              kind: select
              required: true
              source:
                commandPath:
                - auth
                - clients
                - list
                emptyMessage: No OAuth2 clients are available; create a client first
                labelFields:
                - name
                - id
                valueField: id
              title: OAuth2 client
              valueType: string
            - argument: 1
              kind: select
              required: true
              source:
                args:
                - $arg0
                commandPath:
                - auth
                - clients
                - secrets
                - list
                emptyMessage: This client has no secrets to delete
                labelFields:
                - name
                - id
                valueField: id
              title: Client secret
              valueType: string
            runnable: true
            short: Delete a client secret
            use: delete CLIENT SECRET
          use: secrets
        use: clients
      - args:
          max: 0
          min: 0
        runnable: false
        short: Read Auth users
        subcommands:
        - args:
            max: 0
            min: 0
          runnable: true
          short: List users
          use: list
        - args:
            max: 1
            min: 1
          inputs:
          - argument: 0
            kind: select
            required: true
            source:
              commandPath:
              - auth
              - users
              - list
              emptyMessage: No Auth users are available
              labelFields:
              - email
              - subject
              - id
              valueField: id
            title: User
            valueType: string
          runnable: true
          short: Show a user
          use: show USER
        use: users
      target: stack
      use: auth
